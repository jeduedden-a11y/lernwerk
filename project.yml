name: Lernwerk
options:
  bundleIdPrefix: io.github.jeduedden-a11y
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de
packages:
  LernwerkCore:
    path: Packages/LernwerkCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Lernwerk:
    type: application
    platform: iOS
    sources:
      - path: App
      # Lessons and runtime as shipped with the app (copied by scripts/bundle-content.sh, not in git).
      # A folder reference keeps the directory tree: Content/courses/<kurs>/course.json and so on.
      - path: Resources/Content
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: LernwerkCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lernwerk
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.jeduedden-a11y.lernwerk
        PRODUCT_NAME: Lernwerk
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  Lernwerk:
    build:
      targets:
        Lernwerk: all
    run:
      config: Debug
    archive:
      config: Release
